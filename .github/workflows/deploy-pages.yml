name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      # The update checker compares the running bundle against this file.
      # If it ever stops being emitted, every tab silently reports "up to
      # date" — a failure that looks like nothing at all.
      - name: Verify release manifest exists
        run: |
          test -f dist/release.json || { echo "::error::dist/release.json missing - the update checker cannot work"; exit 1; }
          python3 -c "import json;d=json.load(open('dist/release.json'));assert d['buildId'] and d['buildId']!='dev', d; print('build', d['buildId'], 'v'+d['version'])"

      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      # NOTE: actions/configure-pages is deliberately not used here.
      # It performs GET /repos/{owner}/{repo}/pages, which returns 404 until
      # Pages has been enabled once in repository settings, and a 404 fails
      # this job. Its only useful output (base_path) is already supplied
      # explicitly through VITE_BASE_PATH, so the step is unnecessary.
      # Enablement is a one-time manual step: Settings -> Pages -> Source:
      # GitHub Actions. See README "Building and deploying".

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
