name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy rules and hosting
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # A skipped deploy step looks exactly like a successful run on the
      # Actions list, which is how the security rules went un-deployed for
      # several releases while everything appeared green. Warn loudly instead.
      - name: Warn when the deploy secret is missing
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT == '' }}
        run: |
          echo "::warning title=Firestore rules are NOT deployed::The FIREBASE_SERVICE_ACCOUNT secret is not set, so this run only tested the app. Every database read will fail with permission-denied until the rules are published."
          {
            echo "### ⚠️ Rules were not deployed"
            echo ""
            echo "The \`FIREBASE_SERVICE_ACCOUNT\` secret is missing, so this run only tested and built the app."
            echo ""
            echo "Until the rules are published, every database read fails with \`permission-denied\`."
            echo "Either add the secret, or deploy from a machine with Firebase CLI access:"
            echo ""
            echo '\`\`\`bash'
            echo "npm run deploy:rules"
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deployment runs only when the repository service-account secret exists.
      - name: Deploy
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: w9jds/firebase-action@v13.29.1
        with:
          # Storage is deliberately excluded. The CLI validates every requested
          # target before deploying any of them, so including `storage` on a
          # project where Cloud Storage has not been set up aborts the entire
          # run - including the Firestore rules the app needs to function.
          # Deploy storage separately once the bucket exists.
          args: deploy --only hosting,firestore:rules,firestore:indexes
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
