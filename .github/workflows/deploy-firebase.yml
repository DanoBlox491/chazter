name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy rules and hosting
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Deployment runs only when the repository service-account secret exists.
      - name: Deploy
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: w9jds/firebase-action@v13.29.1
        with:
          # Storage is deliberately excluded. The CLI validates every requested
          # target before deploying any of them, so including `storage` on a
          # project where Cloud Storage has not been set up aborts the entire
          # run - including the Firestore rules the app needs to function.
          # Deploy storage separately once the bucket exists.
          args: deploy --only hosting,firestore:rules,firestore:indexes
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
