name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy rules and hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # Requires a FIREBASE_TOKEN or a service-account secret configured by
      # the repository owner. This workflow is optional: `firebase deploy`
      # from a developer machine works too.
      - name: Deploy
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: w9jds/firebase-action@v13.29.1
        with:
          args: deploy --only hosting,firestore:rules,firestore:indexes,storage
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
